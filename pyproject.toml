[project]
name = "tg-dl-bot"
version = "0.1.0"
description = "Telegram message saver bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.8.0",
    "flask[async]>=3.1.3",
    "pyrogram",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "speedtest-cli>=2.1.3",
    "tgcrypto>=1.2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
pyrogram = { url = "https://www.dl.dropboxusercontent.com/scl/fi/35w0i0hnsioq63x7eumdd/pyrogagan.zip?rlkey=mq4b56v0z7w7mgj3c0o3sqgo1&st=n7prfm1y&dl=0" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
