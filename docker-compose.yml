services:
  telegram-bot:
    image: ghcr.io/phoenix-yyj/tg-dl-bot:${IMAGE_TAG:-latest}
    container_name: telegram-saver-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./sessions:/app/sessions
      - ./attached_assets:/app/attached_assets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
